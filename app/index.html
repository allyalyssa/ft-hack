    <button class="navlink" data-view="cases"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span class="lbl">PO cases</span><span class="badge" id="b-cases"></span></button>
    <button class="navlink" data-view="disputes"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4M12 17v.01"/></svg><span class="lbl">Disputes</span><span class="badge" id="b-disputes"></span></button>
    <button class="navlink" data-view="writeoffs"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span class="lbl">Write-offs</span><span class="badge" id="b-writeoffs"></span></button>
    <div class="group">Data</div>
    <a class="navlink navout" id="upload-link" href="/upload"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span class="lbl">Upload export</span></a>
    </div>
    <button class="asktoggle" id="asktoggle" aria-expanded="false" aria-controls="ask"><img src="/assets/collex-companion.png" alt="" width="24" height="24">Ask Collex</button>
    <div class="boxinfo" id="boxinfo"><div class="live">Running on this box</div></div>
  </nav>

  <main id="main" tabindex="-1" aria-live="polite"></main>

  <aside class="ask" id="ask" aria-label="Ask Collex" hidden>
    <header><img class="companion-avatar" src="/assets/collex-companion.png" alt="" width="56" height="56"><div><b>Ask Collex</b><p>Find an invoice, check an approval, or follow a case.</p></div><button class="closeask" id="closeask" aria-label="Close records panel"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
    <div class="thread" id="thread">
      <div class="prompts" id="prompts"></div>
    </div>
    <form class="askbar" id="askform">
      <input id="askq" autocomplete="off" placeholder="Ask about an invoice, account or approval" aria-label="Ask about your records">
      <button class="btn primary" type="submit">Ask</button>
    </form>
  </aside>
</div>


<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$" + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = n => Number(n || 0).toLocaleString();
function avatar(name) {
  const words = String(name || "?").split(/\s+/).filter(Boolean);
  const init = (words[0]?.[0] || "?") + (words[1]?.[0] || "");
  return `<span class="av">${esc(init.toUpperCase())}</span>`;
}
const pl = (n, one, many) => `${num(n)} ${Number(n) === 1 ? one : (many || one + "s")}`;
const PROMPTS = ["What's waiting for my approval?", "Has INV-112347 been approved?", "Why hasn't INV-100036 been drafted?",
                 "Which PO cases are ready?", "Was anything withdrawn?", "Which write-offs need a controller?"];
let ov = null, view = "today", selected = null, cache = {}, seq = 0, dseq = 0;

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : undefined);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function reviewer() { try { return localStorage.getItem("reviewer") || ""; } catch (e) { return ""; } }
function setReviewer(v) { try { localStorage.setItem("reviewer", v); } catch (e) {} }
function linkInvoices(text) {
  return esc(text).replace(/\bINV-\d{5,}\b/g, m => `<button class="inv" data-inv="${m}">${m}</button>`);
}

/* ---------- navigation ---------- */
function go(v, id) {
  ++seq; ++dseq;
  view = v; selected = id || null;
  const hash = id ? `${v}/${id}` : v;
  if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
  document.querySelectorAll(".navlink").forEach(a => a.setAttribute("aria-current", a.dataset.view === v ? "page" : "false"));
  window.scrollTo(0,0);
  render();
}
function fromHash() {
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const [v, id] = h.split("/");
  go(["today", "approvals", "accounts", "cases", "disputes", "writeoffs", "invoice"].includes(v) ? v : "today", id);
}

/* ---------- sidebar ---------- */
function sidebar() {
  if (!ov) return;
  const set = (id, n, cls) => { const b = $(id); b.textContent = n ? num(n) : ""; b.className = "badge " + (n ? cls : ""); };
  set("#b-approvals", ov.awaiting + ov.withdrawn, ov.withdrawn ? "stop" : "hot");
  set("#b-accounts", ov.packages, "");
  set("#b-cases", (ov.blockers.by_state || {}).ready, "go");
  set("#b-disputes", ov.p1, "hot");
  set("#b-writeoffs", ov.controller, "hot");
  $("#boxinfo").innerHTML = `<div class="live">Running on this box, offline</div>
    <div>Model <span class="mono">${esc(ov.model || "local")}</span></div>
    <div>Snapshot ${esc(ov.as_of)}</div>${ov.last_run ? `<div>Last run ${esc(String(ov.last_run).replace("T", " "))}</div>` : ""}`;
}

/* ---------- views ---------- */
async function render() {
  const m = $("#main");
  try {
    if (view === "today") return await today(m);
    if (view === "approvals") return await listView(m, "Approvals", "Review prepared drafts. Withdrawn drafts appear first and cannot be approved.",
      "/api/drafts", approvalRow, r => r.invoice_id);
    if (view === "accounts") return await listView(m, "Accounts", "Queued invoices grouped by customer, so one conversation covers every small balance on the account.",
      "/api/packages", accountRow, r => r.package_id, packageDetail);
    if (view === "cases") return await listView(m, "PO cases", "Track missing purchase orders, check supporting evidence, and review corrected invoices.",
      "/api/cases", caseRow, r => r.invoice_id);
    if (view === "disputes") return await listView(m, "Disputes", "Disputed small invoices with a reason, an owner and a reply-by date. Highest priority first.",
      "/api/disputes", disputeRow, r => r.invoice_id);
    if (view === "writeoffs") return await listView(m, "Write-offs", "Balances under the write-off limit. Batches and large account totals wait for a controller.",
      "/api/writeoffs", writeoffRow, r => r.invoice_id);
    if (view === "invoice") return await invoiceOnly(m);
  } catch (e) {
    m.innerHTML = `<div class="empty">Couldn't load this view: ${esc(e.message)}. Records may be updating. Reload this page to try again.</div>`;
  }
}

const board = {scope:"all", q:"", owner:"", sort:"days", direction:"desc", page:1};
let boardRequest = 0, searchTimer;
const chevron = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>';
async function today(m) {
  m.innerHTML = `<div class="head board-head"><h1>Invoice board</h1><div class="board-meta"><span id="board-date">Loading snapshot</span><button class="btn" id="refreshboard">Refresh</button></div></div>
    <div class="market-strip" id="market-strip" aria-label="Portfolio totals"><span class="loading">Loading invoice balances…</span></div>
    <div class="board-controls"><div class="board-tabs" role="group" aria-label="Invoice status">${[["all","All invoices"],["open","Open"],["overdue","Overdue"],["disputed","Disputed"],["queued","In queue"],["paid","Paid"]].map(([id,label]) => `<button data-scope="${id}" aria-pressed="${board.scope === id}">${label}<span aria-hidden="true" data-scope-count="${id}"></span></button>`).join("")}</div>
    <div class="board-filters"><input type="search" id="board-search" aria-label="Search all invoices" placeholder="Search invoice, account or owner" value="${esc(board.q)}"><select id="board-owner" aria-label="Filter by owner"><option value="">All owners</option></select></div></div>
    <div class="ledger-wrap" tabindex="0" role="region" aria-label="Invoice ledger, scroll for more columns" aria-busy="true">
    <table class="ledger"><caption class="sr">All invoice records. Sort a column or open an invoice to review its supporting records.</caption><thead><tr>${[["invoice_id","Invoice"],["account_name","Account"],["balance","Balance"],["due_date","Due date"],["days","Days overdue"],["status","Status"],["owner","Owner"],["last_touch","Last contact"]].map(([key,label]) => `<th scope="col" data-column="${key}" ${["balance","days"].includes(key) ? 'class="number"' : ""}><button data-sort="${key}">${label}<span class="sort-arrow" aria-hidden="true"></span></button></th>`).join("")}<th scope="col">Workflow</th><th scope="col"><span class="sr">Details</span></th></tr></thead><tbody id="ledger-rows"><tr><td colspan="10" class="empty">Loading invoices…</td></tr></tbody></table></div>
    <div class="board-footer"><span id="board-count" role="status"></span><div class="pagination"><button class="btn" id="board-prev" aria-label="Previous page" disabled>Previous</button><span id="board-page"></span><button class="btn" id="board-next" aria-label="Next page" disabled>Next</button></div></div>
    <p class="data-note">Synthetic data · snapshot of the invoice export. Balances are in USD.</p>`;
  await loadBoard();
}
async function loadBoard() {
  const request = ++boardRequest;
  const wrap = $(".ledger-wrap"); if (!wrap) return;
  wrap.setAttribute("aria-busy", "true");
  $("#refreshboard").disabled = true;
  try {
    const data = await api("/api/ledger?" + new URLSearchParams(board));
    if (request !== boardRequest || view !== "today" || !$("#ledger-rows")) return;
    board.page = data.page;
    $("#board-date").textContent = "Snapshot " + data.as_of;
    $("#market-strip").innerHTML = `<div><span>Outstanding</span><strong>${money(data.summary.outstanding)}</strong></div><div><span>Overdue</span><strong class="negative">${money(data.summary.overdue)}</strong></div><div><span>Payments recorded</span><strong class="positive">${money(data.summary.paid)}</strong></div><button data-goto="approvals"><span>Awaiting review</span><strong>${num(ov?.awaiting)}<span class="metric-unit"> drafts</span></strong></button><button data-goto="cases"><span>PO cases</span><strong>${num(ov?.blockers?.open)}<span class="metric-unit"> open</span></strong></button>`;
    document.querySelectorAll("[data-scope]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.scope === board.scope)));
    document.querySelectorAll("[data-scope-count]").forEach(el => el.textContent = num(data.counts[el.dataset.scopeCount]));
    const owner = $("#board-owner");
    if (owner.options.length === 1) owner.innerHTML += data.owners.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
    owner.value = board.owner;
    document.querySelectorAll("[data-column]").forEach(th => {
      th.setAttribute("aria-sort", th.dataset.column === board.sort ? (board.direction === "asc" ? "ascending" : "descending") : "none");
      th.querySelector(".sort-arrow").innerHTML = th.dataset.column === board.sort ? `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="${board.direction === "asc" ? "m3 8 3-4 3 4" : "m3 4 3 4 3-4"}"/></svg>` : "";
    });
    $("#ledger-rows").innerHTML = data.rows.length ? data.rows.map(r => {
      const paid = r.balance <= 0, overdue = r.days > 0 && !paid;
      const status = paid ? "Paid" : r.disputed ? "Disputed" : overdue ? "Overdue" : "Open";
      const flow = r.bucket === "writeoff" ? "Write-off review" : r.bucket === "escalate" ? "Dispute review" : r.queued ? "Follow-up queue" : "—";
      return `<tr><td><button class="invoice-link" data-inv="${esc(r.invoice_id)}">${esc(r.invoice_id)}</button><span class="mobile-account" title="${esc(r.account_name)}">${esc(r.account_name)}</span></td><td class="ledger-account">${esc(r.account_name)}</td><td class="number amount">${money(r.balance)}</td><td class="date">${esc(r.due_date)}</td><td class="number muted">${paid ? "—" : r.days > 0 ? num(r.days) : r.days === 0 ? "Due today" : "Due in " + num(-r.days)}</td><td><span class="board-status ${paid ? "positive" : r.disputed ? "warning" : overdue ? "negative" : "muted"}">${status}</span></td><td>${esc(r.owner)}</td><td class="date muted">${esc(r.last_touch || "Never")}</td><td class="workflow">${flow}</td><td><button class="open-invoice" data-inv="${esc(r.invoice_id)}" aria-label="Open ${esc(r.invoice_id)}">${chevron}</button></td></tr>`;
    }).join("") : `<tr><td colspan="10" class="empty"><p>No invoices match these filters.</p><button class="btn" id="clearboard">Clear filters</button></td></tr>`;
    $("#board-count").textContent = data.total ? `${num((data.page-1)*50+1)}–${num(Math.min(data.page*50,data.total))} of ${num(data.total)} ${data.total === 1 ? "invoice" : "invoices"}` : "0 invoices";
    $("#board-page").textContent = `${data.page} / ${Math.max(1,Math.ceil(data.total/50))}`;
    $("#board-prev").disabled = data.page <= 1;
    $("#board-next").disabled = data.page*50 >= data.total;
    wrap.scrollTop = 0;
  } catch (e) {
    if (request === boardRequest && view === "today" && $("#ledger-rows")) {
      $("#ledger-rows").innerHTML = `<tr><td colspan="10" class="empty"><p>Couldn’t load invoices: ${esc(e.message)}</p><button class="btn" id="retryboard">Try again</button></td></tr>`;
      $("#board-count").textContent = "Invoice data unavailable";
    }
  } finally {
    if (request === boardRequest && view === "today" && $(".ledger-wrap")) {
      $(".ledger-wrap").setAttribute("aria-busy","false"); $("#refreshboard").disabled = false;
    }
  }
}

async function listView(m, title, sub, url, rowFn, idOf, detailFn) {
  m.innerHTML = `<div class="head"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div></div>
    <div class="toolbar"><input id="list-search" type="search" placeholder="Filter this view" aria-label="Filter this view"><span id="list-count" role="status"></span></div>
    <div class="split"><div class="list" id="list">${'<div class="skel"></div>'.repeat(5)}</div><div class="detail" id="detail"><div class="empty">Pick one from the list.</div></div></div>`;
  const my = ++seq;
  const rows = cache[url] = await api(url);
  if (my !== seq || !$("#list")) return;  // the user moved on while this list loaded
  const update = () => {
    const q = $("#list-search").value.trim().toLowerCase();
    const matches = rows.filter(r => [r.invoice_id,r.account_name,r.account_owner,r.state,r.label].some(v => String(v || "").toLowerCase().includes(q)));
    const shown = matches.slice(0,150);
    $("#list-count").textContent = `${num(matches.length)} loaded records${matches.length > 150 ? " · first 150 shown" : ""}`;
    $("#list").innerHTML = shown.length ? shown.map(r => rowFn(r,idOf(r) === selected)).join("") : '<div class="empty">No matching records in this view.</div>';
    if (!shown.length) { ++dseq; $("#detail").innerHTML='<div class="empty">Adjust your filter or choose another view.</div>'; return; }
    const first = shown.find(r => idOf(r) === selected) || shown[0];
    openDetail(idOf(first),detailFn);
  };
  $("#list-search").addEventListener("input",update);
  update();
}

function approvalRow(r, sel) {
  const pill = r.withdraw ? '<span class="pill stop">withdrawn</span>'
    : {drafted: '<span class="pill hot">waiting for you</span>', edited: '<span class="pill hot">edited, waiting</span>',
       approved: '<span class="pill go">approved</span>', rejected: '<span class="pill">rejected</span>'}[r.state] || "";
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="mono">${esc(r.invoice_id)}</span> &middot; ${esc(r.days_past_due)} days past due &middot; ${pill}</div></div></button>`;
}
function accountRow(r, sel) {
  return `<button class="row" data-id="${esc(r.package_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.dollars)}</span></div>
    <div class="meta">${num(r.count)} invoices &middot; oldest ${esc(r.oldest_days_past_due)} days &middot; ${esc(r.account_owner)}${r.coordinate ? ' &middot; <span class="pill hot">owner is talking to them</span>' : ""}</div></div></button>`;
}
function caseRow(r, sel) {
  const cls = {ready: "go", blocked: "stop"}[r.state] || "";
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="mono">${esc(r.invoice_id)}</span> &middot; <span class="pill ${cls}">${esc(r.label)}</span></div></div></button>`;
}
function disputeRow(r, sel) {
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="pill ${r.priority === "P1" ? "hot" : ""}">${esc(r.priority)}</span> ${esc(r.reason_label)} &middot; reply by ${esc(r.respond_by)}${r.concede_recommended ? ' &middot; <span class="pill">concede</span>' : ""}</div></div></button>`;
}
function writeoffRow(r, sel) {
  const c = r.controls || {};
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="mono">${esc(r.invoice_id)}</span> &middot; ${r.tiny_origin === "residual" ? "left over after a partial payment" : "issued tiny"} &middot; ${c.needs_controller ? '<span class="pill hot">needs a controller</span>' : '<span class="pill go">within limits</span>'}</div></div></button>`;
}

async function openDetail(id, detailFn) {
  selected = id;
  document.querySelectorAll("#list .row").forEach(r => r.setAttribute("aria-current", r.dataset.id === id ? "true" : "false"));
  history.replaceState(null, "", `#${view}/${id}`);
  const d = $("#detail");
  if (!d) return;
  const my = ++dseq;
  d.innerHTML = '<div class="empty">Loading.</div>';
  let html;
  try { html = await (detailFn || invoiceDetail)(id); }
  catch (e) { html = `<div class="empty">${esc(e.message)}</div>`; }
  if (my === dseq && $("#detail")) $("#detail").innerHTML = html;
}

async function packageDetail(id) {
  const p = await api("/api/package/" + encodeURIComponent(id));
  return `<div class="dhead">${avatar(p.account_name)}<div><h2>${esc(p.account_name)}</h2><div class="idline"><span class="mono">${esc(p.account_id)}</span> &middot; owner ${esc(p.account_owner)}</div></div></div>
    <div class="figs"><div><div class="k">Queued here</div><div class="v">${money(p.dollars)}</div></div><div><div class="k">Invoices</div><div class="v">${num(p.count)}</div></div><div><div class="k">Open on the whole account</div><div class="v">${money(p.open_balance)}</div></div></div>
    ${p.coordinate_reason ? `<div class="suggest hot"><div class="k">Go through the owner</div>${esc(p.coordinate_reason)}</div>`
      : `<div class="suggest"><div class="k">Suggested action</div>Send one reminder that lists all ${num(p.count)} invoices instead of ${num(p.count)} separate emails.</div>`}
    <div class="section"><h3>Invoices in this package</h3><div class="list">${p.items.map(i => `<button class="row" data-inv="${esc(i.invoice_id)}" style="grid-template-columns:minmax(0,1fr)"><div><div class="top"><span class="mono">${esc(i.invoice_id)}</span><span class="amt">${money(i.balance)}</span></div><div class="meta">${esc(i.bucket)} &middot; ${esc(i.days_past_due)} days past due &middot; last touch ${esc(i.last_touch_date || "never")}</div></div></button>`).join("")}</div></div>`;
}

async function invoiceDetail(id) {
  const d = await api("/api/invoice/" + encodeURIComponent(id));
  const q = d.queue || {}, a = d.action || {}, s = a.status || {}, r = a.recheck || {};
  let box = "";
  if (r.verdict === "withdraw") box = `<div class="suggest stop"><div class="k">Don't send this</div>${esc((r.reasons || []).join("; "))}. Withdrawn by the stale-draft check against the ${esc(r.checked_against)} export.</div>`;
  else if (d.case && d.case.state === "ready") box = `<div class="suggest"><div class="k">Ready to send</div>${esc((d.case.history || []).at(-1)?.detail || "The PO checked out against the invoice.")}</div>`;
  else if (d.case && d.case.state === "blocked") box = `<div class="suggest stop"><div class="k">Blocked</div>${esc((d.case.open_questions || []).join("; "))}</div>`;
  else if (q.coordinate) box = `<div class="suggest hot"><div class="k">Go through the owner</div>${esc(q.coordinate.reason)}</div>`;
  else if (d.dispute) box = `<div class="suggest hot"><div class="k">Suggested action</div>${esc(d.dispute.resolution)}</div>`;
  else if (q.writeoff_controls) box = `<div class="suggest ${q.writeoff_controls.needs_controller ? "hot" : ""}"><div class="k">${q.writeoff_controls.needs_controller ? "Needs a controller" : "Write off"}</div>${esc((q.writeoff_controls.reasons || []).join("; "))}.</div>`;
  else if (s.state) box = `<div class="suggest"><div class="k">Suggested action</div>Approve the reminder below; it goes out with the next send.</div>`;

  const drafts = Object.entries(d.drafts || {}).map(([k, v]) => `<div class="section"><h3>${esc({customer_email: "Email to the customer", customer_slack: "Slack to the customer", internal_note: "Note to the account owner", writeoff_memo: "Write-off memo"}[k] || k)}</h3><div class="doc">${esc(v)}</div></div>`).join("");
  const casePart = d.case ? `<div class="section"><h3>PO case: ${esc(d.case.label)}</h3><ul class="timeline">${(d.case.history || []).map(h => `<li><span class="muted">${esc(h.at)}</span><span>${esc(h.detail)} <span class="muted" style="font-size:12px">${esc(h.source)}</span></span></li>`).join("")}</ul></div>`
    + (d.case.package?.customer_email?.body ? `<div class="section"><h3>Corrected invoice email</h3><div class="doc">${esc(d.case.package.customer_email.body)}</div></div>` : "") : "";
  const disputePart = d.dispute?.owner_note?.body && !d.case ? `<div class="section"><h3>Note to ${esc(d.dispute.route_email)}</h3><div class="doc">${esc(d.dispute.owner_note.body)}</div></div>` : "";

  let actions = "";
  const canDecide = ["drafted", "edited"].includes(s.state) && r.verdict !== "withdraw";
  if (canDecide) actions = `<div class="actions"><input class="reviewer" id="who" placeholder="Your name" value="${esc(reviewer())}" aria-label="Your name">
      <button class="btn primary" data-decide="approve" data-id="${esc(id)}">Approve and queue to send</button>
      <button class="btn danger" data-decide="reject" data-id="${esc(id)}">Reject</button><span class="toast" id="toast"></span></div>`;
  else if (!s.state && q.bucket === "agent") actions = `<div class="actions"><button class="btn primary" data-decide="draft" data-id="${esc(id)}">Draft it now</button><span class="toast" id="toast">Prepare a draft for review using the local model.</span></div>`;

  return `<div class="dhead">${avatar(d.account_name)}<div><h2>${esc(d.account_name)}</h2><div class="idline"><span class="mono">${esc(id)}</span> &middot; ${esc(d.status)} &middot; owner ${esc(d.account_owner)}</div></div></div>
    <div class="figs"><div><div class="k">Balance</div><div class="v">${money(d.balance)}</div></div><div><div class="k">Days past due</div><div class="v">${esc(q.days_past_due ?? "-")}</div></div><div><div class="k">Last touch</div><div class="v" style="font-size:15px">${esc(q.last_touch_date || "never")}</div></div></div>
    ${box}<p class="muted" style="margin:0">${linkInvoices(d.explain)}</p>${casePart}${drafts}${disputePart}${actions}`;
}

async function invoiceOnly(m) {
  m.innerHTML = `<div class="head"><div><a href="#today" class="back-board">Back to invoice board</a><h1>Invoice</h1><p>Balance, account history, and supporting records.</p></div></div><div class="detail" id="detail"><div class="empty">Loading.</div></div>`;
  const my = ++dseq;
  let html;
  try { html = await invoiceDetail(selected); } catch (e) { html = `<div class="empty">${esc(e.message)}</div>`; }
  if (my === dseq && $("#detail")) $("#detail").innerHTML = html;
}

/* ---------- decisions ---------- */
async function decide(btn) {
  const id = btn.dataset.id, action = btn.dataset.decide, who = ($("#who") || {}).value || "";
  if (who) setReviewer(who);
  document.querySelectorAll("[data-decide]").forEach(b => b.disabled = true);
  $("#toast").textContent = action === "draft" ? "Drafting on the box..." : "Saving...";
  try {
    const r = await api("/api/decide", {invoice_id: id, action, by: who});
    $("#toast").textContent = r.message;
    await refresh();
    if (view !== "today") openDetail(id);
  } catch (e) { $("#toast").textContent = e.message; document.querySelectorAll("[data-decide]").forEach(b => b.disabled = false); }
}

/* ---------- the agent ---------- */
function promptsView() {
  $("#prompts").innerHTML = `<div class="hello"><img class="companion-welcome" src="/assets/collex-companion.png" alt="A fluffy oatmeal plush companion with floppy ears, rosy cheeks and two tiny teeth, waving hello" width="144" height="144"><h2>A little help with your invoices.</h2><p>Answers use your local records and include their sources.</p></div>`
    + PROMPTS.slice(0, 4).map(p => `<button class="prompt" data-ask="${esc(p)}">${esc(p)}</button>`).join("");
}
async function ask(q) {
  q = q.trim(); if (!q) return;
  const t = $("#thread");
  t.insertAdjacentHTML("beforeend", `<div class="q">${esc(q)}</div>`);
  const wrap = document.createElement("div"); wrap.className = "msg";
  const slot = document.createElement("div"); slot.className = "a"; slot.innerHTML = '<div class="who"><span class="agent-name"><img src="/assets/collex-companion.png" alt="" width="24" height="24">Collex</span></div><span class="loading" role="status">Checking your records…</span>';
  wrap.appendChild(slot); t.appendChild(wrap); t.scrollTop = t.scrollHeight;
  try {
    const r = await api("/api/ask", {q});
    slot.innerHTML = `<div class="who"><span class="agent-name"><img src="/assets/collex-companion.png" alt="" width="24" height="24">Collex</span> <span>${esc(r.ms)} ms &middot; snapshot ${esc(r.as_of)}</span></div><div class="txt">${linkInvoices(r.answer)}</div>
      ${r.steps.length ? `<details class="how"><summary>Sources and checks</summary><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><div class="src">${r.sources.map(s => `<span>${esc(s)}</span>`).join("")}</div></details>` : ""}`;
  } catch (e) { slot.innerHTML = `<div class="who"><span class="agent-name"><img src="/assets/collex-companion.png" alt="" width="24" height="24">Collex</span></div><div class="txt">I couldn't read the records just now (${esc(e.message)}). Try again in a moment.</div>`; }
  t.scrollTop = t.scrollHeight;
}

const dockedChat = matchMedia("(min-width:1200px)");
function setAskOpen(open, focus = true) {
  const wasOpen = !$("#ask").hidden;
  $("#ask").hidden = !open;
  document.body.classList.toggle("chat-open", open);
  $("#asktoggle").setAttribute("aria-expanded", String(open));
  if (focus) { if (open) $("#askq").focus(); else if (wasOpen) $("#asktoggle").focus(); }
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#ask").hidden) setAskOpen(false); });
window.addEventListener("hashchange", () => { if (location.hash !== "#main") fromHash(); });
/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const scope = e.target.closest("[data-scope]"); if (scope) { clearTimeout(searchTimer); board.scope=scope.dataset.scope; board.page=1; return loadBoard(); }
  const sort = e.target.closest("[data-sort]"); if (sort) { clearTimeout(searchTimer); board.direction = board.sort === sort.dataset.sort && board.direction === "desc" ? "asc" : "desc"; board.sort=sort.dataset.sort; board.page=1; return loadBoard(); }
  if (e.target.closest("#board-prev")) { board.page--; return loadBoard(); }
  if (e.target.closest("#board-next")) { board.page++; return loadBoard(); }
  if (e.target.closest("#refreshboard, #retryboard")) return loadBoard();
  if (e.target.closest("#clearboard")) { clearTimeout(searchTimer); Object.assign(board,{q:"",owner:"",scope:"all",page:1}); $("#board-search").value=""; return loadBoard(); }
  if (e.target.closest("#retryoverview")) return refresh().then(() => { if (ov) fromHash(); });
  const nav = e.target.closest(".navlink"); if (nav) return go(nav.dataset.view);
  const g = e.target.closest("[data-goto]"); if (g) return go(g.dataset.goto);
  const inv = e.target.closest("[data-inv]"); if (inv) { if (!dockedChat.matches) setAskOpen(false); return go("invoice", inv.dataset.inv); }
  const row = e.target.closest("#list .row"); if (row) return openDetail(row.dataset.id, view === "accounts" ? packageDetail : null);
  const dec = e.target.closest("[data-decide]"); if (dec) return decide(dec);
  const p = e.target.closest("[data-ask]"); if (p) return ask(p.dataset.ask);
  if (e.target.closest("#asktoggle")) setAskOpen($("#ask").hidden);
  if (e.target.closest("#closeask")) setAskOpen(false);
});
document.addEventListener("input", e => {
  if (e.target.id === "board-search") { board.q=e.target.value; board.page=1; clearTimeout(searchTimer); searchTimer=setTimeout(loadBoard,200); }
});
document.addEventListener("change", e => { if (e.target.id === "board-owner") { board.owner=e.target.value; board.page=1; loadBoard(); } });
$("#askform").addEventListener("submit", e => { e.preventDefault(); const v = $("#askq").value; $("#askq").value = ""; ask(v); });
async function refresh() {
  try {
    ov = await api("/api/overview"); sidebar();

  } catch (e) {
    if (!ov) $("#main").innerHTML = `<div class="empty"><p>Couldn’t load the workspace: ${esc(e.message)}</p><button class="btn" id="retryoverview">Try again</button></div>`;
  }
}
promptsView();
const syncChatLayout = () => setAskOpen(dockedChat.matches, false);
dockedChat.addEventListener("change", syncChatLayout);
syncChatLayout();
refresh().then(() => { if (ov) fromHash(); });
setInterval(() => { if (!document.hidden) refresh(); }, 30000);

</script>
</body>
</html>
