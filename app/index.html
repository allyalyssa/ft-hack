<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenbar Collections</title>
<style>
/* Greenbar, done properly: a forest-green sidebar (the ledger cover), a warm paper canvas with greenbar-striped
   lists, and green as the action colour. Amber = a person must look, red = don't send / blocked. */
:root {
  --forest:#0F2A1F; --forest-2:#163828; --forest-3:#1F4A36; --forest-ink:#E3F0E8; --forest-muted:#93B8A3; --lime:#A6EBC0;
  --paper:#F3F5EF; --surface:#FFFFFF; --band:#EDF4E8; --line:#DDE4D8; --line-2:#C9D3C4;
  --ink:#14201A; --muted:#566259; --faint:#7D887F;
  --green:#1F7A4D; --green-2:#176240; --green-soft:#E1F1E6; --green-line:#B9DEC6;
  --amber:#8A5A12; --amber-soft:#FAEFD9; --amber-line:#EBD3A3;
  --red:#A8402C; --red-soft:#F8E4DE; --red-line:#EBC2B7;
  --sans:Inter, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --display:"Segoe UI Variable Display", Inter, "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow:0 1px 2px rgba(20, 32, 26, .05), 0 4px 14px rgba(20, 32, 26, .05);
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.5 var(--sans); font-variant-numeric:tabular-nums;
       accent-color:var(--green); caret-color:var(--green); scrollbar-color:var(--line-2) transparent; }
::selection { background:var(--green-soft); color:var(--ink); }
:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
button { font:inherit; color:inherit; }
.mono { font-family:var(--mono); font-size:.9em; letter-spacing:-.01em; }
.muted { color:var(--muted); }
a { color:var(--green); }
svg.i { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

.shell { display:grid; grid-template-columns:244px minmax(0, 1fr) 392px; height:100%; }

/* ledger cover */
nav.side { background:var(--forest); color:var(--forest-ink); display:flex; flex-direction:column; padding:20px 14px; gap:3px; }
.brand { display:flex; align-items:center; gap:11px; padding:2px 8px 22px; }
.mark { width:34px; height:34px; border-radius:2px; background:var(--lime); display:grid; place-items:center; }
.mark i { display:block; width:18px; height:3px; background:var(--forest); box-shadow:0 6px 0 var(--forest), 0 -6px 0 var(--forest); border-radius:2px; }
.brand b { font:650 17px/1.1 var(--display); letter-spacing:-.01em; color:#fff; }
.brand span { display:block; color:var(--forest-muted); font-size:12px; margin-top:2px; }
.navlink { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:2px; color:var(--forest-muted);
           border:0; background:none; text-align:left; cursor:pointer; width:100%; transition:background-color 150ms ease-out, color 150ms ease-out; }
.navlink .lbl { flex:1; }
.navlink:hover { background:var(--forest-2); color:var(--forest-ink); }
.navlink[aria-current="page"] { background:var(--forest-3); color:#fff; }
.navlink[aria-current="page"] svg.i { color:var(--lime); }
.badge { min-width:24px; padding:0 8px; border-radius:2px; font-size:12px; line-height:21px; text-align:center; background:var(--forest-2); color:var(--forest-muted); font-weight:600; }
.badge:empty { display:none; }
.badge.hot { background:#4A3A14; color:#F5CF7E; }
.badge.go { background:var(--lime); color:var(--forest); }
.badge.stop { background:#5A2A20; color:#F7B3A3; }
.group { margin:16px 11px 6px; color:#6E9480; font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.boxinfo { margin-top:auto; padding:14px 12px; border-radius:2px; background:var(--forest-2); font-size:12px; color:var(--forest-muted); display:grid; gap:4px; }
.live { display:flex; align-items:center; gap:8px; color:var(--forest-ink); font-weight:600; }
.live::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--lime); box-shadow:0 0 0 0 rgba(166, 235, 192, .6); animation:pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(166, 235, 192, .55); } 70%, 100% { box-shadow:0 0 0 8px rgba(166, 235, 192, 0); } }

/* canvas */
main { overflow:auto; padding:28px 32px 56px; min-width:0; }
.head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:20px; }
.head h1 { margin:0; font:650 26px/1.2 var(--display); letter-spacing:-.02em; }
.head p { margin:6px 0 0; color:var(--muted); max-width:72ch; font-size:14.5px; }
.head p b { color:var(--ink); }
.cta { display:inline-flex; align-items:center; gap:8px; background:var(--green); color:#fff; border:0; border-radius:2px; padding:10px 16px; cursor:pointer; font-weight:600; box-shadow:var(--shadow); }
.cta:hover { background:var(--green-2); }

.kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:14px; margin-bottom:16px; }
.kpi { background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:16px 18px; text-align:left; cursor:pointer; box-shadow:var(--shadow);
       display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:center; transition:transform 150ms ease-out, border-color 150ms ease-out; }
.kpi:hover { transform:translateY(-1px); border-color:var(--green-line); }
.kpi .ic { grid-row:span 3; width:44px; height:44px; border-radius:2px; display:grid; place-items:center; background:var(--green-soft); color:var(--green); }
.kpi.hot .ic { background:var(--amber-soft); color:var(--amber); } .kpi.stop .ic { background:var(--red-soft); color:var(--red); }
.kpi .ic svg.i { width:22px; height:22px; }
.kpi .n { font:700 28px/1.05 var(--display); letter-spacing:-.02em; }
.kpi .l { font-weight:600; }
.kpi .s { color:var(--muted); font-size:12.5px; }

.grid2 { display:grid; grid-template-columns:minmax(0, 1.35fr) minmax(0, 1fr); gap:14px; margin-bottom:14px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:18px 20px; min-width:0; box-shadow:var(--shadow); }
.card h2 { margin:0; font:650 16px/1.3 var(--display); }
.card .sub { color:var(--muted); font-size:13px; margin:2px 0 14px; }

.chart { display:flex; align-items:flex-end; gap:14px; height:190px; padding-top:28px; border-bottom:1px solid var(--line); }
.bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; height:100%; position:relative; min-width:0; }
.bar .col { border-radius:2px; min-height:6px; transition:height 700ms cubic-bezier(.2, .8, .2, 1); }
.bar .val { position:absolute; left:0; right:0; text-align:center; font-weight:650; font-size:13px; transform:translateY(-22px); }
.axis { display:flex; gap:14px; margin-top:8px; }
.axis div { flex:1; text-align:center; font-size:12.5px; color:var(--muted); }
.axis b { display:block; color:var(--ink); font-size:12.5px; font-weight:600; }

.todo { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:11px 10px; margin:0 -10px; border-radius:2px; cursor:pointer; background:none; border:0; width:calc(100% + 20px); text-align:left; }
.todo:hover { background:var(--band); }
.todo .ti { width:32px; height:32px; border-radius:2px; display:grid; place-items:center; }
.todo .ti svg.i { width:17px; height:17px; }
.ti.go { background:var(--green-soft); color:var(--green); } .ti.hot { background:var(--amber-soft); color:var(--amber); } .ti.stop { background:var(--red-soft); color:var(--red); }
.todo .t { font-weight:600; }
.todo .d { color:var(--muted); font-size:12.5px; }
.todo .go-arrow { color:var(--faint); }

.steps { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:10px; position:relative; }
.steps::before { content:""; position:absolute; left:16px; right:16px; top:15px; height:2px; background:var(--green-line); }
.steps li { position:relative; padding-top:40px; }
.steps li::before { content:"✓"; position:absolute; top:0; left:0; width:32px; height:32px; border-radius:2px; background:var(--green); color:#fff; display:grid; place-items:center; font-weight:700; font-size:14px; box-shadow:0 0 0 4px var(--surface); }
.steps b { display:block; font-weight:650; }
.steps span { color:var(--muted); font-size:12.5px; }

/* lists */
.split { display:grid; grid-template-columns:minmax(320px, 430px) minmax(0, 1fr); gap:14px; align-items:start; }
.list { background:var(--surface); border:1px solid var(--line); border-radius:2px; overflow:hidden; box-shadow:var(--shadow); }
.row { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:0; padding:12px 16px; cursor:pointer; transition:background-color 120ms ease-out; }
.row:nth-child(even) { background:var(--band); }
.row:hover { background:var(--green-soft); }
.row[aria-current="true"] { background:var(--green-soft); box-shadow:inset 0 0 0 1px var(--green-line); }
.av { width:36px; height:36px; border-radius:2px; display:grid; place-items:center; font-weight:700; font-size:13px; color:#fff; letter-spacing:.02em; }
.row .top { display:flex; justify-content:space-between; gap:10px; }
.row .who { font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .amt { font-family:var(--mono); font-weight:600; }
.row .meta { color:var(--muted); font-size:12.5px; margin-top:1px; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
.pill { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; line-height:20px; padding:0 9px; border-radius:2px; background:var(--band); color:var(--muted); white-space:nowrap; }
.pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.8; }
.pill.go { background:var(--green-soft); color:var(--green); } .pill.hot { background:var(--amber-soft); color:var(--amber); }
.pill.stop { background:var(--red-soft); color:var(--red); }
.more { padding:12px 16px; color:var(--faint); font-size:12.5px; border-top:1px solid var(--line); background:var(--surface); }

/* detail */
.detail { background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:22px 24px; min-width:0; box-shadow:var(--shadow); }
.dhead { display:flex; gap:14px; align-items:center; }
.dhead .av { width:48px; height:48px; border-radius:2px; font-size:16px; }
.detail h2 { margin:0; font:650 21px/1.2 var(--display); letter-spacing:-.01em; }
.idline { color:var(--muted); margin-top:2px; }
.figs { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin:18px 0; }
.figs > div { background:var(--band); border-radius:2px; padding:12px 14px; }
.figs .k { color:var(--muted); font-size:12px; font-weight:600; }
.figs .v { font:700 20px/1.25 var(--mono); letter-spacing:-.02em; }
.suggest { position:relative; border:1px solid var(--green-line); background:var(--green-soft); border-radius:2px; padding:14px 16px 14px 58px; margin:14px 0; }
.suggest::before { position:absolute; left:16px; top:14px; content:"→"; width:28px; height:28px; border-radius:2px; background:var(--green); color:#fff; display:grid; place-items:center; font-weight:700; }
.suggest.stop { border-color:var(--red-line); background:var(--red-soft); } .suggest.stop::before { content:"!"; background:var(--red); }
.suggest.hot { border-color:var(--amber-line); background:var(--amber-soft); } .suggest.hot::before { content:"i"; background:var(--amber); }
.suggest .k { font-size:12px; font-weight:700; color:var(--green); letter-spacing:.02em; }
.suggest.stop .k { color:var(--red); } .suggest.hot .k { color:var(--amber); }
.section { margin-top:18px; }
.section h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:650; }
.doc { background:var(--paper); border:1px solid var(--line); border-radius:2px; padding:14px 16px; white-space:pre-wrap; font-size:13.5px; max-width:80ch; }
.timeline { list-style:none; margin:0; padding:0; }
.timeline li { display:grid; grid-template-columns:100px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
.timeline li:first-child { border-top:0; }
.actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); }
.btn { border:1px solid var(--line-2); background:var(--surface); border-radius:2px; padding:10px 16px; cursor:pointer; font-weight:600; }
.btn:hover { border-color:var(--muted); }
.btn.primary { background:var(--green); color:#fff; border-color:var(--green); box-shadow:0 2px 6px rgba(31, 122, 77, .25); }
.btn.primary:hover { background:var(--green-2); }
.btn.danger { color:var(--red); border-color:var(--red-line); }
.btn:disabled { opacity:.5; cursor:default; }
.reviewer { background:var(--paper); border:1px solid var(--line-2); border-radius:2px; padding:9px 12px; color:var(--ink); width:160px; font:inherit; }
.toast { color:var(--muted); }
.empty { color:var(--muted); padding:32px; text-align:center; }
.skel { height:62px; background:linear-gradient(90deg, var(--surface) 0, var(--band) 40%, var(--surface) 80%); background-size:200% 100%; animation:shimmer 1.2s linear infinite; border-bottom:1px solid var(--line); }
@keyframes shimmer { to { background-position:-200% 0; } }

/* the agent */
aside.ask { background:var(--surface); border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
.ask header { padding:18px 18px 16px; background:var(--forest); color:var(--forest-ink); display:flex; gap:12px; align-items:center; }
.ask header b { display:block; font:650 16px/1.2 var(--display); color:#fff; }
.ask header p { margin:3px 0 0; color:var(--forest-muted); font-size:12.5px; }
.penny { width:44px; height:44px; flex:none; }
.penny.sm { width:30px; height:30px; }
.thread { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; background:var(--paper); }
.hello { display:flex; gap:10px; align-items:flex-start; }
.hello .bub { background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:10px 12px; box-shadow:var(--shadow); }
.prompts { display:grid; gap:8px; }
.prompt { display:flex; align-items:center; gap:10px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:10px 12px; cursor:pointer; color:var(--ink); box-shadow:var(--shadow); transition:border-color 150ms ease-out, transform 150ms ease-out; }
.prompt svg.i { color:var(--green); width:16px; height:16px; }
.prompt:hover { border-color:var(--green-line); transform:translateX(2px); }
.q { align-self:flex-end; max-width:85%; background:var(--green); color:#fff; border-radius:2px; padding:9px 13px; box-shadow:var(--shadow); }
.msg { display:flex; gap:10px; align-items:flex-start; }
.a { flex:1; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:2px; padding:12px 14px; box-shadow:var(--shadow); }
.a .who { font-size:12px; color:var(--green); font-weight:700; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px; }
.a .who span { color:var(--faint); font-weight:500; }
.a .txt { white-space:pre-wrap; }
.inv { color:var(--green); cursor:pointer; text-decoration:underline; text-underline-offset:3px; background:none; border:0; padding:0; font-family:var(--mono); font-size:.9em; font-weight:600; }
.typing { display:inline-flex; gap:4px; padding:4px 0; }
.typing i { width:7px; height:7px; border-radius:50%; background:var(--green); opacity:.35; animation:blink 1s infinite; }
.typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
@keyframes blink { 50% { opacity:1; } }
details.how { margin-top:10px; border-top:1px dashed var(--line-2); padding-top:8px; }
details.how summary { cursor:pointer; color:var(--green); font-size:12.5px; font-weight:600; }
details.how ol { margin:8px 0 6px; padding-left:18px; color:var(--muted); font-size:12.5px; }
.src { display:flex; flex-wrap:wrap; gap:4px; }
.src span { font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--band); border-radius:2px; padding:2px 7px; }
form.askbar { display:flex; gap:8px; padding:14px; border-top:1px solid var(--line); background:var(--surface); }
form.askbar input { flex:1; min-width:0; background:var(--paper); border:1px solid var(--line-2); color:var(--ink); border-radius:2px; padding:11px 13px; font:inherit; }
form.askbar input::placeholder { color:var(--faint); }
form.askbar input:focus { border-color:var(--green); outline:none; box-shadow:0 0 0 3px var(--green-soft); }
.asktoggle { display:none; }

@media (max-width:1320px) {
  .shell { grid-template-columns:220px minmax(0, 1fr); }
  aside.ask { position:fixed; right:0; top:0; bottom:0; width:min(392px, 100%); z-index:20; transform:translateX(100%); transition:transform 220ms ease-out; box-shadow:-8px 0 30px rgba(0, 0, 0, .12); }
  aside.ask.open { transform:none; }
  .asktoggle { display:inline-flex; position:fixed; right:20px; bottom:20px; z-index:21; }
  .steps { grid-template-columns:repeat(3, minmax(0, 1fr)); row-gap:18px; } .steps::before { display:none; }
}
@media (max-width:900px) {
  .shell { grid-template-columns:minmax(0, 1fr); }
  nav.side { flex-direction:row; flex-wrap:wrap; padding:10px; } .group, .boxinfo { display:none; } .brand { padding:4px 8px; }
  .navlink { width:auto; }
  .split, .grid2 { grid-template-columns:minmax(0, 1fr); }
  .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  main { padding:16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Main">
    <div class="brand"><div class="mark"><i></i></div><div><b>Greenbar</b><span>Small-dollar collections</span></div></div>
    <button class="navlink" data-view="today"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Today</span></button>
    <div class="group">Work</div>
    <button class="navlink" data-view="approvals"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg><span class="lbl">Approvals</span><span class="badge" id="b-approvals"></span></button>
    <button class="navlink" data-view="accounts"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3M3 21h18"/></svg><span class="lbl">Accounts</span><span class="badge" id="b-accounts"></span></button>
    <button class="navlink" data-view="cases"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span class="lbl">PO cases</span><span class="badge" id="b-cases"></span></button>
    <button class="navlink" data-view="disputes"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4M12 17v.01"/></svg><span class="lbl">Disputes</span><span class="badge" id="b-disputes"></span></button>
    <button class="navlink" data-view="writeoffs"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span class="lbl">Write-offs</span><span class="badge" id="b-writeoffs"></span></button>
    <div class="boxinfo" id="boxinfo"><div class="live">Running on this box</div></div>
  </nav>

  <main id="main" aria-live="polite"></main>

  <aside class="ask" id="ask" aria-label="Ask the agent">
    <header><svg class="penny" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 12 L13 4 L18 10 Z M38 12 L35 4 L30 10 Z" fill="#4FAE76"/><rect x="4" y="8" width="40" height="38" rx="17" fill="#5FC487"/><path d="M24 9v6M9 26h3M36 30h3" stroke="#2F7D52" stroke-width="1.4" stroke-dasharray="1.6 1.8" stroke-linecap="round"/><circle cx="16" cy="22" r="6.5" fill="#F6F2E6" stroke="#14301F" stroke-width="1.6"/><circle cx="14.2" cy="20.2" r="1" fill="#14301F"/><circle cx="17.8" cy="20.2" r="1" fill="#14301F"/><circle cx="14.2" cy="23.8" r="1" fill="#14301F"/><circle cx="17.8" cy="23.8" r="1" fill="#14301F"/><circle cx="32" cy="21" r="4.6" fill="#E9B54F" stroke="#14301F" stroke-width="1.6"/><circle cx="30.9" cy="21" r=".9" fill="#14301F"/><circle cx="33.1" cy="21" r=".9" fill="#14301F"/><rect x="12" y="31" width="24" height="10" rx="4.5" fill="#2B1714"/><rect x="14.5" y="31" width="4" height="4.6" rx="1" fill="#FBF8EE"/><rect x="19.5" y="31" width="4.4" height="5.4" rx="1" fill="#FBF8EE"/><rect x="25" y="31" width="4" height="4.4" rx="1" fill="#FBF8EE"/><rect x="30" y="31" width="3.6" height="5" rx="1" fill="#FBF8EE"/><rect x="17" y="37" width="4" height="4" rx="1" fill="#FBF8EE"/><rect x="26" y="37.4" width="4" height="3.6" rx="1" fill="#FBF8EE"/></svg><div><b>Ask Penny</b><p>The collections agent on this box. Every answer shows how it was found.</p></div></header>
    <div class="thread" id="thread">
      <div class="prompts" id="prompts"></div>
    </div>
    <form class="askbar" id="askform">
      <input id="askq" autocomplete="off" placeholder="Ask about an invoice, account or approval" aria-label="Ask Penny">
      <button class="btn primary" type="submit">Ask</button>
    </form>
  </aside>
</div>
<button class="cta asktoggle" id="asktoggle"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask Penny</button>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => "$" + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = n => Number(n || 0).toLocaleString();
const PENNY_SM = `<svg class="penny sm" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 12 L13 4 L18 10 Z M38 12 L35 4 L30 10 Z" fill="#4FAE76"/><rect x="4" y="8" width="40" height="38" rx="17" fill="#5FC487"/><path d="M24 9v6M9 26h3M36 30h3" stroke="#2F7D52" stroke-width="1.4" stroke-dasharray="1.6 1.8" stroke-linecap="round"/><circle cx="16" cy="22" r="6.5" fill="#F6F2E6" stroke="#14301F" stroke-width="1.6"/><circle cx="14.2" cy="20.2" r="1" fill="#14301F"/><circle cx="17.8" cy="20.2" r="1" fill="#14301F"/><circle cx="14.2" cy="23.8" r="1" fill="#14301F"/><circle cx="17.8" cy="23.8" r="1" fill="#14301F"/><circle cx="32" cy="21" r="4.6" fill="#E9B54F" stroke="#14301F" stroke-width="1.6"/><circle cx="30.9" cy="21" r=".9" fill="#14301F"/><circle cx="33.1" cy="21" r=".9" fill="#14301F"/><rect x="12" y="31" width="24" height="10" rx="4.5" fill="#2B1714"/><rect x="14.5" y="31" width="4" height="4.6" rx="1" fill="#FBF8EE"/><rect x="19.5" y="31" width="4.4" height="5.4" rx="1" fill="#FBF8EE"/><rect x="25" y="31" width="4" height="4.4" rx="1" fill="#FBF8EE"/><rect x="30" y="31" width="3.6" height="5" rx="1" fill="#FBF8EE"/><rect x="17" y="37" width="4" height="4" rx="1" fill="#FBF8EE"/><rect x="26" y="37.4" width="4" height="3.6" rx="1" fill="#FBF8EE"/></svg>`;
const ICONS = {"today": "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z\"/></svg>", "approvals": "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12.5l2.5 2.5L16 9.5\"/></svg>", "accounts": "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M8 8h3M8 12h3M8 16h3M3 21h18\"/></svg>", "cases": "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"/><path d=\"M14 3v5h5M9 13h6M9 17h4\"/></svg>", "disputes": "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3.5l9 16H3z\"/><path d=\"M12 10v4M12 17v.01\"/></svg>", "writeoffs": "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 3h12v18l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 12h6\"/></svg>", "ask": "<svg class=\"i\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z\"/></svg>"};
const AV = ["#1F7A4D", "#2E6E8E", "#7A5A1F", "#5B4B8A", "#2F7D6B", "#8A4A3A", "#3C6E3A", "#6A5D2E"];
function avatar(name) {
  const words = String(name || "?").split(/\s+/).filter(Boolean);
  const init = (words[0]?.[0] || "?") + (words[1]?.[0] || "");
  let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return `<span class="av" style="background:${AV[h % AV.length]}">${esc(init.toUpperCase())}</span>`;
}
function countUp(root) {
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = Number(el.dataset.count) || 0, fmt = el.dataset.fmt;
    const show = v => el.textContent = fmt === "money" ? "$" + Math.round(v).toLocaleString() : Math.round(v).toLocaleString();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches || !target) return show(target);
    const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 700); show(target * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const pl = (n, one, many) => `${num(n)} ${Number(n) === 1 ? one : (many || one + "s")}`;
const PROMPTS = ["What's waiting for my approval?", "Has INV-112347 been approved?", "Why hasn't INV-100036 been drafted?",
                 "Which PO cases are ready?", "Was anything withdrawn?", "Which write-offs need a controller?"];
let ov = null, view = "today", selected = null, cache = {}, seq = 0, dseq = 0;

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : undefined);
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function reviewer() { try { return localStorage.getItem("reviewer") || ""; } catch (e) { return ""; } }
function setReviewer(v) { try { localStorage.setItem("reviewer", v); } catch (e) {} }
function linkInvoices(text) {
  return esc(text).replace(/\bINV-\d{5,}\b/g, m => `<button class="inv" data-inv="${m}">${m}</button>`);
}

/* ---------- navigation ---------- */
function go(v, id) {
  view = v; selected = id || null;
  const hash = id ? `${v}/${id}` : v;
  if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
  document.querySelectorAll(".navlink").forEach(a => a.setAttribute("aria-current", a.dataset.view === v ? "page" : "false"));
  render();
}
function fromHash() {
  let h = "";
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  const [v, id] = h.split("/");
  go(["today", "approvals", "accounts", "cases", "disputes", "writeoffs", "invoice"].includes(v) ? v : "today", id);
}

/* ---------- sidebar ---------- */
function sidebar() {
  if (!ov) return;
  const set = (id, n, cls) => { const b = $(id); b.textContent = n ? num(n) : ""; b.className = "badge " + (n ? cls : ""); };
  set("#b-approvals", ov.awaiting + ov.withdrawn, ov.withdrawn ? "stop" : "hot");
  set("#b-accounts", ov.packages, "");
  set("#b-cases", (ov.blockers.by_state || {}).ready, "go");
  set("#b-disputes", ov.p1, "hot");
  set("#b-writeoffs", ov.controller, "hot");
  $("#boxinfo").innerHTML = `<div class="live">Running on this box, offline</div>
    <div>Model <span class="mono">${esc(ov.model || "local")}</span></div>
    <div>Snapshot ${esc(ov.as_of)}</div>${ov.last_run ? `<div>Last run ${esc(String(ov.last_run).replace("T", " "))}</div>` : ""}`;
}

/* ---------- views ---------- */
async function render() {
  const m = $("#main");
  try {
    if (view === "today") return today(m);
    if (view === "approvals") return await listView(m, "Approvals", "Drafts the agent made, waiting for you. Anything the stale-draft check pulled is at the top in red.",
      "/api/drafts", approvalRow, r => r.invoice_id);
    if (view === "accounts") return await listView(m, "Accounts", "Queued invoices grouped by customer, so one conversation covers every small balance on the account.",
      "/api/packages", accountRow, r => r.package_id, packageDetail);
    if (view === "cases") return await listView(m, "PO cases", "Disputes blocked on a missing purchase order. The agent keeps each one open until the PO checks out against the invoice.",
      "/api/cases", caseRow, r => r.invoice_id);
    if (view === "disputes") return await listView(m, "Disputes", "Disputed small invoices with a reason, an owner and a reply-by date. Highest priority first.",
      "/api/disputes", disputeRow, r => r.invoice_id);
    if (view === "writeoffs") return await listView(m, "Write-offs", "Balances under the write-off limit. Batches and large account totals wait for a controller.",
      "/api/writeoffs", writeoffRow, r => r.invoice_id);
    if (view === "invoice") return await invoiceOnly(m);
  } catch (e) {
    m.innerHTML = `<div class="empty">Couldn't load this view: ${esc(e.message)}. The agent's files may be mid-update; try again in a moment.</div>`;
  }
}

function today(m) {
  if (!ov) { m.innerHTML = '<div class="empty">Loading the latest run.</div>'; return; }
  const st = ov.blockers.by_state || {};
  const hour = new Date().getHours();
  const hi = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  const todo = [
    ov.withdrawn && ["stop", "approvals", `${pl(ov.withdrawn, "draft")} withdrawn before sending`, "The invoice changed after the draft: paid, disputed, new contact or touched by a person.", "approvals"],
    ov.awaiting && ["hot", "approvals", `${pl(ov.awaiting, "draft")} waiting for your approval`, "Reminders the agent wrote from the invoice and account history.", "approvals"],
    st.ready && ["go", "cases", `${pl(st.ready, "PO case")} ready to send`, "The PO matched the invoice; a corrected invoice email is drafted.", "cases"],
    st.blocked && ["stop", "cases", `${pl(st.blocked, "PO case")} blocked`, "The PO the owner sent doesn't match the invoice.", "cases"],
    ov.p1 && ["hot", "disputes", `${pl(ov.p1, "P1 dispute")} need${Number(ov.p1) === 1 ? "s" : ""} a reply`, "Routed to the account owner, deal desk or billing ops with a reply-by date.", "disputes"],
    ov.controller && ["hot", "writeoffs", `${pl(ov.controller, "write-off")} need${Number(ov.controller) === 1 ? "s" : ""} a controller`, "A batch on one account, or more than the account limit.", "writeoffs"],
  ].filter(Boolean);
  const aging = ov.aging || [];
  const top = Math.max(1, ...aging.map(a => a.dollars));
  const COLORS = ["#9BD3AE", "#4FA874", "#D9A441", "#C4634E"];
  m.innerHTML = `
    <div class="head"><div><h1>${hi}</h1>
      <p>The agent found <b>${num(ov.queued)} small invoices worth ${money(ov.queued_dollars)}</b> that nobody had followed up on, out of ${num(ov.invoices)} on the books. Here's where they stand.</p></div>
      <button class="cta" id="focusask">${ICONS.ask}Ask Penny about any invoice</button></div>
    <div class="kpis">
      <button class="kpi" data-goto="accounts"><span class="ic">${ICONS.accounts}</span><div class="n" data-count="${ov.packages}">0</div><div class="l">Accounts to work</div><div class="s">${num(ov.queued)} invoices, ${money(ov.queued_dollars)}</div></button>
      <button class="kpi hot" data-goto="approvals"><span class="ic">${ICONS.approvals}</span><div class="n" data-count="${ov.awaiting}">0</div><div class="l">Waiting for you</div><div class="s">${pl(ov.drafted, "draft")} so far</div></button>
      <button class="kpi" data-goto="cases"><span class="ic">${ICONS.cases}</span><div class="n" data-count="${st.ready || 0}">0</div><div class="l">PO cases ready</div><div class="s">${num(ov.blockers.open)} open, ${num(st.blocked)} blocked</div></button>
      <button class="kpi ${ov.withdrawn ? "stop" : ""}" data-goto="approvals"><span class="ic">${ICONS.disputes}</span><div class="n" data-count="${ov.withdrawn}">0</div><div class="l">Stopped before sending</div><div class="s">stale-draft check, every cycle</div></button>
    </div>
    <div class="grid2">
      <section class="card"><h2>Where the forgotten money sits</h2><div class="sub">Queued dollars by days past due. The longer it sits, the less of it comes back.</div>
        <div class="chart">${aging.map((a, i) => `<div class="bar"><div class="col" style="height:${Math.max(3, a.dollars / top * 100)}%;background:${COLORS[i % COLORS.length]}"><div class="val">$${Math.round(a.dollars / 1000)}k</div></div></div>`).join("")}</div>
        <div class="axis">${aging.map(a => `<div><b>${esc(a.label)} days</b>${num(a.count)} invoices</div>`).join("")}</div>
      </section>
      <section class="card"><h2>Needs you</h2><div class="sub">In the order the agent would work them.</div>
        ${todo.map(([c, ic, t, d, v]) => `<button class="todo" data-goto="${v}"><span class="ti ${c}">${ICONS[ic]}</span><span><span class="t">${esc(t)}</span><br><span class="d">${esc(d)}</span></span><span class="go-arrow">&rsaquo;</span></button>`).join("") || '<div class="empty">Nothing needs you right now.</div>'}
      </section>
    </div>
    <section class="card"><h2>What the agent did this run</h2><div class="sub">On this box, from the ${esc(ov.as_of)} export.</div>
      <ol class="steps">
        <li><b>Read</b><span>${num(ov.invoices)} invoices from Salesforce, the collector sheet and Slack</span></li>
        <li><b>Triaged</b><span>${num(ov.queued)} into ${num(ov.packages)} accounts; ${num(ov.coordinate)} held for an owner</span></li>
        <li><b>Drafted</b><span>${pl(ov.drafted, "follow-up")} with the local model</span></li>
        <li><b>Worked disputes</b><span>${num(ov.disputes)} with a reason and owner; ${num(ov.blockers.open)} PO cases</span></li>
        <li><b>Re-checked</b><span>every draft against the newest export; ${num(ov.withdrawn)} stopped</span></li>
        <li><b>Saved</b><span>about ${num(ov.hours)} collector hours</span></li>
      </ol>
    </section>`;
  countUp(m);
}

async function listView(m, title, sub, url, rowFn, idOf, detailFn) {
  m.innerHTML = `<div class="head"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div></div>
    <div class="split"><div class="list" id="list">${'<div class="skel"></div>'.repeat(5)}</div><div class="detail" id="detail"><div class="empty">Pick one from the list.</div></div></div>`;
  const my = ++seq;
  const rows = cache[url] = await api(url);
  if (my !== seq || !$("#list")) return;  // the user moved on while this list loaded
  const shown = rows.slice(0, 150);
  $("#list").innerHTML = shown.length ? shown.map(r => rowFn(r, idOf(r) === selected)).join("")
    + (rows.length > shown.length ? `<div class="more">Showing ${num(shown.length)} of ${num(rows.length)}. Ask the agent about any invoice or account by name.</div>` : "")
    : '<div class="empty">Nothing here yet. The agent fills this list every cycle.</div>';
  const first = selected || (shown[0] && idOf(shown[0]));
  if (first) openDetail(first, detailFn);
}

function approvalRow(r, sel) {
  const pill = r.withdraw ? '<span class="pill stop">withdrawn</span>'
    : {drafted: '<span class="pill hot">waiting for you</span>', edited: '<span class="pill hot">edited, waiting</span>',
       approved: '<span class="pill go">approved</span>', rejected: '<span class="pill">rejected</span>'}[r.state] || "";
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="mono">${esc(r.invoice_id)}</span> &middot; ${esc(r.days_past_due)} days past due &middot; ${pill}</div></div></button>`;
}
function accountRow(r, sel) {
  return `<button class="row" data-id="${esc(r.package_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.dollars)}</span></div>
    <div class="meta">${num(r.count)} invoices &middot; oldest ${esc(r.oldest_days_past_due)} days &middot; ${esc(r.account_owner)}${r.coordinate ? ' &middot; <span class="pill hot">owner is talking to them</span>' : ""}</div></div></button>`;
}
function caseRow(r, sel) {
  const cls = {ready: "go", blocked: "stop"}[r.state] || "";
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="mono">${esc(r.invoice_id)}</span> &middot; <span class="pill ${cls}">${esc(r.label)}</span></div></div></button>`;
}
function disputeRow(r, sel) {
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="pill ${r.priority === "P1" ? "hot" : ""}">${esc(r.priority)}</span> ${esc(r.reason_label)} &middot; reply by ${esc(r.respond_by)}${r.concede_recommended ? ' &middot; <span class="pill">concede</span>' : ""}</div></div></button>`;
}
function writeoffRow(r, sel) {
  const c = r.controls || {};
  return `<button class="row" data-id="${esc(r.invoice_id)}" aria-current="${sel}">${avatar(r.account_name)}<div><div class="top"><span class="who">${esc(r.account_name)}</span><span class="amt">${money(r.balance)}</span></div>
    <div class="meta"><span class="mono">${esc(r.invoice_id)}</span> &middot; ${r.tiny_origin === "residual" ? "left over after a partial payment" : "issued tiny"} &middot; ${c.needs_controller ? '<span class="pill hot">needs a controller</span>' : '<span class="pill go">within limits</span>'}</div></div></button>`;
}

async function openDetail(id, detailFn) {
  selected = id;
  document.querySelectorAll("#list .row").forEach(r => r.setAttribute("aria-current", r.dataset.id === id ? "true" : "false"));
  history.replaceState(null, "", `#${view}/${id}`);
  const d = $("#detail");
  if (!d) return;
  const my = ++dseq;
  d.innerHTML = '<div class="empty">Loading.</div>';
  let html;
  try { html = await (detailFn || invoiceDetail)(id); }
  catch (e) { html = `<div class="empty">${esc(e.message)}</div>`; }
  if (my === dseq && $("#detail")) $("#detail").innerHTML = html;
}

async function packageDetail(id) {
  const p = await api("/api/package/" + encodeURIComponent(id));
  return `<div class="dhead">${avatar(p.account_name)}<div><h2>${esc(p.account_name)}</h2><div class="idline"><span class="mono">${esc(p.account_id)}</span> &middot; owner ${esc(p.account_owner)}</div></div></div>
    <div class="figs"><div><div class="k">Queued here</div><div class="v">${money(p.dollars)}</div></div><div><div class="k">Invoices</div><div class="v">${num(p.count)}</div></div><div><div class="k">Open on the whole account</div><div class="v">${money(p.open_balance)}</div></div></div>
    ${p.coordinate_reason ? `<div class="suggest hot"><div class="k">Go through the owner</div>${esc(p.coordinate_reason)}</div>`
      : `<div class="suggest"><div class="k">Suggested action</div>Send one reminder that lists all ${num(p.count)} invoices instead of ${num(p.count)} separate emails.</div>`}
    <div class="section"><h3>Invoices in this package</h3><div class="list">${p.items.map(i => `<button class="row" data-inv="${esc(i.invoice_id)}" style="grid-template-columns:minmax(0,1fr)"><div><div class="top"><span class="mono">${esc(i.invoice_id)}</span><span class="amt">${money(i.balance)}</span></div><div class="meta">${esc(i.bucket)} &middot; ${esc(i.days_past_due)} days past due &middot; last touch ${esc(i.last_touch_date || "never")}</div></div></button>`).join("")}</div></div>`;
}

async function invoiceDetail(id) {
  const d = await api("/api/invoice/" + encodeURIComponent(id));
  const q = d.queue || {}, a = d.action || {}, s = a.status || {}, r = a.recheck || {};
  let box = "";
  if (r.verdict === "withdraw") box = `<div class="suggest stop"><div class="k">Don't send this</div>${esc((r.reasons || []).join("; "))}. Withdrawn by the stale-draft check against the ${esc(r.checked_against)} export.</div>`;
  else if (d.case && d.case.state === "ready") box = `<div class="suggest"><div class="k">Ready to send</div>${esc((d.case.history || []).at(-1)?.detail || "The PO checked out against the invoice.")}</div>`;
  else if (d.case && d.case.state === "blocked") box = `<div class="suggest stop"><div class="k">Blocked</div>${esc((d.case.open_questions || []).join("; "))}</div>`;
  else if (q.coordinate) box = `<div class="suggest hot"><div class="k">Go through the owner</div>${esc(q.coordinate.reason)}</div>`;
  else if (d.dispute) box = `<div class="suggest hot"><div class="k">Suggested action</div>${esc(d.dispute.resolution)}</div>`;
  else if (q.writeoff_controls) box = `<div class="suggest ${q.writeoff_controls.needs_controller ? "hot" : ""}"><div class="k">${q.writeoff_controls.needs_controller ? "Needs a controller" : "Write off"}</div>${esc((q.writeoff_controls.reasons || []).join("; "))}.</div>`;
  else if (s.state) box = `<div class="suggest"><div class="k">Suggested action</div>Approve the reminder below; it goes out with the next send.</div>`;

  const drafts = Object.entries(d.drafts || {}).map(([k, v]) => `<div class="section"><h3>${esc({customer_email: "Email to the customer", customer_slack: "Slack to the customer", internal_note: "Note to the account owner", writeoff_memo: "Write-off memo"}[k] || k)}</h3><div class="doc">${esc(v)}</div></div>`).join("");
  const casePart = d.case ? `<div class="section"><h3>PO case: ${esc(d.case.label)}</h3><ul class="timeline">${(d.case.history || []).map(h => `<li><span class="muted">${esc(h.at)}</span><span>${esc(h.detail)} <span class="muted" style="font-size:12px">${esc(h.source)}</span></span></li>`).join("")}</ul></div>`
    + (d.case.package?.customer_email?.body ? `<div class="section"><h3>Corrected invoice email</h3><div class="doc">${esc(d.case.package.customer_email.body)}</div></div>` : "") : "";
  const disputePart = d.dispute?.owner_note?.body && !d.case ? `<div class="section"><h3>Note to ${esc(d.dispute.route_email)}</h3><div class="doc">${esc(d.dispute.owner_note.body)}</div></div>` : "";

  let actions = "";
  const canDecide = ["drafted", "edited"].includes(s.state) && r.verdict !== "withdraw";
  if (canDecide) actions = `<div class="actions"><input class="reviewer" id="who" placeholder="Your name" value="${esc(reviewer())}" aria-label="Your name">
      <button class="btn primary" data-decide="approve" data-id="${esc(id)}">Approve and queue to send</button>
      <button class="btn danger" data-decide="reject" data-id="${esc(id)}">Reject</button><span class="toast" id="toast"></span></div>`;
  else if (!s.state && q.bucket === "agent") actions = `<div class="actions"><button class="btn primary" data-decide="draft" data-id="${esc(id)}">Draft it now</button><span class="toast" id="toast">The local model writes it in a few seconds on the box.</span></div>`;

  return `<div class="dhead">${avatar(d.account_name)}<div><h2>${esc(d.account_name)}</h2><div class="idline"><span class="mono">${esc(id)}</span> &middot; ${esc(d.status)} &middot; owner ${esc(d.account_owner)}</div></div></div>
    <div class="figs"><div><div class="k">Balance</div><div class="v">${money(d.balance)}</div></div><div><div class="k">Days past due</div><div class="v">${esc(q.days_past_due ?? "-")}</div></div><div><div class="k">Last touch</div><div class="v" style="font-size:15px">${esc(q.last_touch_date || "never")}</div></div></div>
    ${box}<p class="muted" style="margin:0">${linkInvoices(d.explain)}</p>${casePart}${drafts}${disputePart}${actions}`;
}

async function invoiceOnly(m) {
  m.innerHTML = `<div class="head"><div><h1>Invoice</h1><p>Everything the agent knows about it.</p></div></div><div class="detail" id="detail"><div class="empty">Loading.</div></div>`;
  const my = ++dseq;
  let html;
  try { html = await invoiceDetail(selected); } catch (e) { html = `<div class="empty">${esc(e.message)}</div>`; }
  if (my === dseq && $("#detail")) $("#detail").innerHTML = html;
}

/* ---------- decisions ---------- */
async function decide(btn) {
  const id = btn.dataset.id, action = btn.dataset.decide, who = ($("#who") || {}).value || "";
  if (who) setReviewer(who);
  document.querySelectorAll("[data-decide]").forEach(b => b.disabled = true);
  $("#toast").textContent = action === "draft" ? "Drafting on the box..." : "Saving...";
  try {
    const r = await api("/api/decide", {invoice_id: id, action, by: who});
    $("#toast").textContent = r.message;
    await refresh();
    if (view !== "today") openDetail(id);
  } catch (e) { $("#toast").textContent = e.message; document.querySelectorAll("[data-decide]").forEach(b => b.disabled = false); }
}

/* ---------- the agent ---------- */
function promptsView() {
  $("#prompts").innerHTML = `<div class="hello">${PENNY_SM}<div class="bub">Hi, I'm Penny. I watch every small invoice so nobody has to. Ask me why something is stuck, or pick one:</div></div>`
    + PROMPTS.map(p => `<button class="prompt" data-ask="${esc(p)}">${ICONS.ask}${esc(p)}</button>`).join("");
}
async function ask(q) {
  q = q.trim(); if (!q) return;
  const t = $("#thread");
  t.insertAdjacentHTML("beforeend", `<div class="q">${esc(q)}</div>`);
  const wrap = document.createElement("div"); wrap.className = "msg"; wrap.innerHTML = PENNY_SM;
  const slot = document.createElement("div"); slot.className = "a"; slot.innerHTML = '<div class="who">Penny</div><span class="typing"><i></i><i></i><i></i></span>';
  wrap.appendChild(slot); t.appendChild(wrap); t.scrollTop = t.scrollHeight;
  try {
    const r = await api("/api/ask", {q});
    slot.innerHTML = `<div class="who">Penny <span>${esc(r.ms)} ms &middot; snapshot ${esc(r.as_of)}</span></div><div class="txt">${linkInvoices(r.answer)}</div>
      ${r.steps.length ? `<details class="how"><summary>How I found this</summary><ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><div class="src">${r.sources.map(s => `<span>${esc(s)}</span>`).join("")}</div></details>` : ""}`;
  } catch (e) { slot.innerHTML = `<div class="who">Penny</div><div class="txt">I couldn't read the records just now (${esc(e.message)}). Try again in a moment.</div>`; }
  t.scrollTop = t.scrollHeight;
}

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest(".navlink"); if (nav) return go(nav.dataset.view);
  const g = e.target.closest("[data-goto]"); if (g) return go(g.dataset.goto);
  const inv = e.target.closest("[data-inv]"); if (inv) { $("#ask").classList.remove("open"); return go("invoice", inv.dataset.inv); }
  const row = e.target.closest("#list .row"); if (row) return openDetail(row.dataset.id, view === "accounts" ? packageDetail : null);
  const dec = e.target.closest("[data-decide]"); if (dec) return decide(dec);
  const p = e.target.closest("[data-ask]"); if (p) return ask(p.dataset.ask);
  if (e.target.closest("#asktoggle")) $("#ask").classList.toggle("open");
  if (e.target.closest("#focusask")) { $("#ask").classList.add("open"); $("#askq").focus(); }
});
$("#askform").addEventListener("submit", e => { e.preventDefault(); const v = $("#askq").value; $("#askq").value = ""; ask(v); });
async function refresh() {
  try { ov = await api("/api/overview"); sidebar(); if (view === "today") today($("#main")); } catch (e) {}
}
promptsView();
refresh().then(fromHash);
setInterval(() => { if (!document.hidden) refresh(); }, 30000);
</script>
</body>
</html>
