# /etc/systemd/system/ollama.service.d/override.conf on the GB10
# Reachable from the OpenShell sandbox, and keeps every loaded model resident
# so the 128 GB is in use while the agent runs (organiser request, 2026-10-25).
[Service]
Environment="OLLAMA_HOST=0.0.0.0"
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_MAX_LOADED_MODELS=4"
Environment="OLLAMA_NUM_PARALLEL=4"
Environment="OLLAMA_CONTEXT_LENGTH=32768"
Environment="OLLAMA_FLASH_ATTENTION=1"
